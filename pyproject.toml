[project]
name = "retail-lab"
version = "0.1.0"
description = "小売の需要予測コンペを、手法が後から読める形で解く"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "torch>=2.4",
    "chronos-forecasting>=2.0",
    "timesfm>=3.0",
    "transformers>=4.40",
]

[project.scripts]
retail-lab = "retail_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_lab"]

# torch は CPU 版だけを使う。GPU ホイールは大きく、ここでは要らない。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".next", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
